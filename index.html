<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance Marketplace</title>
  <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
  <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
  <link
    href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap)"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="#" class="logo">upwork</a>


    <nav class="nav-links" aria-label="Main navigation">
      <a href="#">Hire talent <span>⌄</span></a>
      <a href="#">Get outcomes <span>⌄</span></a>
      <a href="#">Find work <span>⌄</span></a>
      <a href="#">Why Upwork <span>⌄</span></a>
      <a href="#">Pricing</a>
      <a href="#">Enterprise</a>
    </nav>

    <div class="nav-actions">
      <a href="#" class="search" aria-label="Search"></a>
      <a href="#" class="login">Log in</a>
      <a href="#" class="signup">Sign up</a>
    </div>
  </header>

  <main>
    <section class="business-banner">
      <p>Hire the top 1% of talent on Business Plus.</p>

      <a href="#">
        Get started
        <span class="arrow">›</span>
      </a>
    </section>

    <section class="hero">
        <img src="blob:https://chatgpt.com/43ff8933-5893-45e7-bd42-014aa03c8c0b" alt="">
      <div class="overlay"></div>

      <div class="hero-content">
        <div class="switch">
          <button class="active">Hire</button>
          <button>Work</button>
        </div>

        <h1>
          Work at the speed of<br>
          your ambition
        </h1>

        <p>
          Hire experts who use AI to amplify their talent, turning<br>
          complex work into high impact business outcomes
        </p>
      </div>
    </section>
  </main>

</body>
</html>
